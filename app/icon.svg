<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0b1c44"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#ffc247"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98c" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffd98c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#sky)"/>

  <g clip-path="url(#clip)">
    <circle cx="32" cy="46" r="26" fill="none" stroke="#fff" stroke-opacity=".14"/>
    <circle cx="32" cy="46" r="18" fill="none" stroke="#fff" stroke-opacity=".1"/>
    <path d="M8 46 A24 24 0 0 1 56 46" fill="none" stroke="#cfe0ff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <!-- Sun parked at the golden-hour position: the most recognisable silhouette at 16px. -->
    <circle cx="44.9" cy="29" r="11" fill="url(#glow)"/>
    <circle cx="44.9" cy="29" r="5.5" fill="url(#sun)"/>
    <line x1="4" y1="46" x2="60" y2="46" stroke="#cfe0ff" stroke-opacity=".4" stroke-width="1.5"/>
    <rect x="0" y="46" width="64" height="18" fill="#050a18" opacity=".55"/>
  </g>

  <rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".22"/>
</svg>
